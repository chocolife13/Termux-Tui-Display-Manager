name: Build Termux .deb

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  # $PREFIX n'existe pas sur Ubuntu → on force la valeur Termux
  PREFIX: /data/data/com.termux/files/usr
  DEB_NAME: ttdm
  DEB_VERSION: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rendre les scripts exécutables
        run: |
          chmod +x build.sh main.sh

      - name: Construire le paquet .deb
        run: ./build.sh

      - name: Vérifier le contenu du .deb
        run: |
          echo "=== Info ==="
          dpkg-deb -I ttdm_${DEB_VERSION}_all.deb
          echo "=== Contents ==="
          dpkg-deb -c ttdm_${DEB_VERSION}_all.deb
          # Échoue si le script n'est pas dans $PREFIX
          dpkg-deb -c ttdm_${DEB_VERSION}_all.deb | grep -q "data/data/com.termux/files/usr/bin/ttdm" \
            || (echo "❌ Le binaire n'est pas dans \$PREFIX"; exit 1)
          echo "✅ Contenu OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttdm-deb
          path: ttdm_*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rendre les scripts exécutables
        run: chmod +x build.sh main.sh

      - name: Reconstruire le .deb
        run: ./build.sh

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ttdm_*.deb
          generate_release_notes: true
